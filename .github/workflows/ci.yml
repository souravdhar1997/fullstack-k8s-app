name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      ####################################################
      # Backend
      ################################################

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install

      - name: Test Backend
        working-directory: backend
        run: npm test --if-present

      ####################################################
      # Frontend
      #####################################################

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Test Frontend
        working-directory: frontend
        run: npm test --if-present

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      ##############################################
      # Capture the GIT SHA
      ##############################################

      - name: Set Image Tag
        shell: powershell
        run: |
          $sha = "${{ github.sha }}".Substring(0,7)
          "IMAGE_TAG=$sha" >> $env:GITHUB_ENV

      ####################################################
      # Docker Build
      ####################################################

      - name: Build Backend Docker Image
        run: docker build -t savvydhar/backend:${{ env.IMAGE_TAG }} ./backend

      - name: Build Frontend Docker Image
        run: docker build -t savvydhar/frontend:${{ env.IMAGE_TAG }} ./frontend

      ####################################################
      # Docker Login
      ####################################################

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      ####################################################
      # Docker Push
      ####################################################

      - name: Push Backend Image
        run: docker push savvydhar/backend:${{ env.IMAGE_TAG }}

      - name: Push Frontend Image
        run: docker push savvydhar/frontend:${{ env.IMAGE_TAG }}

    ####################################################
    # Kubernetes Deployment using Helm
    ####################################################

      - name: Verify Kubernetes
        shell: powershell
        run: |
          kubectl version --client
          kubectl get nodes
          helm version

      - name: Deploy using Helm
        shell: powershell
        run: |
          helm upgrade --install notes-app ./helm/notes-app `
          --namespace notes-app `
          --create-namespace `
          --set backend.image.tag="abcdef123" `
          --set frontend.image.tag="${{ env.IMAGE_TAG }}"

    ####################################################
    # Verify Rollout
    ####################################################

      - name: Verify Backend Rollout
        run: kubectl rollout status deployment/backend -n notes-app --timeout=180s

      - name: Verify Frontend Rollout
        run: kubectl rollout status deployment/frontend -n notes-app --timeout=180s


    ####################################################
    # Automatic Rollback
    ####################################################

      - name: Rollback on Failure
        if: failure()
        shell: powershell
        run: |
          Write-Host "Deployment failed. Rolling back Helm release..."

          $currentRevision = helm history notes-app -n notes-app `
          --output json | ConvertFrom-Json

          $previousRevision = ($currentRevision | Sort-Object revision)[-2].revision

          helm rollback notes-app $previousRevision -n notes-app

          kubectl rollout status deployment/backend -n notes-app --timeout=180s
          kubectl rollout status deployment/frontend -n notes-app --timeout=180s

          Write-Host "Rollback completed successfully."


    ####################################################
    # Helm History
    ####################################################

      - name: Helm History
        if: always()
        run: helm history notes-app -n notes-app

    ####################################################
    # Show Helm Status
    ####################################################

      - name: Helm Status
        if: always()
        run: helm status notes-app -n notes-app

    ####################################################
    # Show Running Pods
    ####################################################

      - name: Show Running Pods
        run: kubectl get pods -n notes-app -o wide

      - name: Show Running Images
        shell: powershell
        run: |
          kubectl get pods -n notes-app -o=jsonpath="{range .items[*]}{.metadata.name}{': '}{range .spec.containers[*]}{.image}{' '}{end}{'\n'}{end}"